name: llm-local
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
  - pip
  - pip:
    - transformers>=4.45.0
    - accelerate>=0.25.0
    - bitsandbytes>=0.41.0
    - peft>=0.7.0
    - trl>=0.7.0
    - datasets>=2.16.0
    - sentencepiece
    - protobuf
    - scipy
    - jupyter
    - ipywidgets
    - sentence-transformers
    - chromadb
    - streamlit>=1.51  # separate light/dark themes in .streamlit/config.toml
    - ollama>=0.4
    - pymupdf
    - tiktoken
    - pytest