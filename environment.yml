# Conda environment for running Hugging Face models inside the app on an
# NVIDIA GPU (CUDA). For the Ollama backend on any computer, the lighter
# `pip install -r requirements.txt` is enough.
name: llm-local
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - pip
  - pip:
    # Hugging Face models, 4-bit on the GPU
    - transformers>=4.45.0
    - accelerate>=0.25.0      # device_map="auto"
    - bitsandbytes>=0.41.0    # 4-bit quantization
    - sentencepiece           # tokenizer backends some models need
    - protobuf
    - tiktoken
    # Ollama backend
    - ollama>=0.4
    # Documents and retrieval
    - sentence-transformers
    - chromadb
    - pymupdf>=1.24.3         # `import pymupdf` (the old `fitz` name is deprecated)
    # App
    - streamlit>=1.56         # st.iframe (copy button); separate light/dark themes
    # Tests
    - pytest
